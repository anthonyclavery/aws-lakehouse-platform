version: 0.2

env:
  shell: bash

phases:
  install:
    commands:
      - set -euo pipefail
      - curl --fail --silent --show-error --location --output /tmp/terraform.zip https://releases.hashicorp.com/terraform/1.16.2/terraform_1.16.2_linux_amd64.zip
      - unzip -q /tmp/terraform.zip -d /usr/local/bin
      - terraform version
      - python3 -m pip install .
  build:
    commands:
      - set -euo pipefail
      - test -n "${AWS_REGION}"
      - export STATE_BUCKET="aws-lakehouse-platform-$(aws sts get-caller-identity --query Account --output text)-${AWS_REGION}-tfstate"
      - terraform -chdir=terraform init -input=false -reconfigure -backend-config="bucket=${STATE_BUCKET}" -backend-config="key=control-plane/terraform.tfstate" -backend-config="region=${AWS_REGION}" -backend-config="encrypt=true" -backend-config="use_lockfile=true"
      - terraform -chdir=terraform state pull > /tmp/control-plane-state.json
      - source <(python3 scripts/cleanup/export_cleanup_context.py --state /tmp/control-plane-state.json)
      - test "${PROJECT_NAME}" = "aws-lakehouse-platform"
      - test -n "${DEMO_ID}"
      - test -n "${DEMO_EXPIRES_AT}"
      - >-
        terraform -chdir=terraform plan -destroy -input=false -lock-timeout=5m
        -out=/tmp/destroy.tfplan -var="aws_region=${AWS_REGION}"
        -var="demo_id=${DEMO_ID}" -var="expires_at=${DEMO_EXPIRES_AT}"
        -target=aws_glue_catalog_database.lakehouse
        -target=aws_s3_bucket.lakehouse
        -target=aws_s3_bucket_public_access_block.lakehouse
        -target=aws_s3_bucket_server_side_encryption_configuration.lakehouse
        -target=random_id.bucket_suffix
      - terraform -chdir=terraform show -json /tmp/destroy.tfplan > /tmp/destroy-plan.json
      - python3 scripts/cleanup/verify_destroy_plan.py --plan /tmp/destroy-plan.json --demo-id "${DEMO_ID}" --expires-at "${DEMO_EXPIRES_AT}"
      - terraform -chdir=terraform apply -input=false /tmp/destroy.tfplan
