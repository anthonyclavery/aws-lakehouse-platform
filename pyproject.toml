[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aws-lakehouse-platform"
version = "0.1.0"
description = "Synthetic smart-meter data generator and local business-rule validation."
requires-python = ">=3.11"
readme = "README.md"
license = { text = "MIT" }

[project.optional-dependencies]
aws = ["boto3>=1.35.90,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lakehouse_platform = ["sql/*.sql"]

[tool.unittest]
start-directory = "tests"
